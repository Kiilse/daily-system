# Dependency updates (ADR-016). Weekly, minor and patch updates grouped into one PR per ecosystem.
# npm reports "no manifest found" until ticket #5 adds the frontend.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /src/backend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /src/backend/**
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Image digests in infra/docker-compose.yml (the docker ecosystem only reads Dockerfiles).
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
