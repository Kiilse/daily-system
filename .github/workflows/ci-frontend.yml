# Frontend CI (ADR-004, ADR-016, ADR-017): lint (library boundaries included), type-check, unit tests with
# coverage, production build, secret scan of the built bundle. The `frontend` job is a required check of the
# main ruleset (tools/apply-repo-settings.sh).
name: ci-frontend

# No `paths` filter on purpose, as in ci-backend: a required check whose workflow never starts never reports.
# The job always runs and skips its work when the frontend did not change.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect frontend changes
        id: changes
        working-directory: .
        run: |
          # Fail closed: if the diff cannot be computed, git fails the step and so the check.
          changed=$(git diff --name-only HEAD^1 HEAD)
          if grep -qE '^(src/frontend/|tools/scan-bundle(\.test)?\.sh$|\.github/workflows/ci-frontend\.yml$)' <<<"$changed"; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "No frontend change: lint, tests, build and scan skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version-file: src/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install
        if: steps.changes.outputs.frontend == 'true'
        run: npm ci

      - name: Lint
        if: steps.changes.outputs.frontend == 'true'
        run: npm run lint

      - name: Type-check
        if: steps.changes.outputs.frontend == 'true'
        # `-b` follows the project references; `tsc -p tsconfig.json` alone checks nothing (its `files` is empty).
        run: npx tsc -b --noEmit

      - name: Unit tests with coverage
        if: steps.changes.outputs.frontend == 'true'
        run: npm run test:coverage

      - name: Boundary rule tests
        if: steps.changes.outputs.frontend == 'true'
        run: node --test tools/*.test.mjs

      - name: Build (production)
        if: steps.changes.outputs.frontend == 'true'
        run: npm run build -- --configuration production

      - name: Install gitleaks
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Bundle scan tests
        if: steps.changes.outputs.frontend == 'true'
        run: ../../tools/scan-bundle.test.sh

      - name: Bundle secret scan
        if: steps.changes.outputs.frontend == 'true'
        run: ../../tools/scan-bundle.sh dist/
