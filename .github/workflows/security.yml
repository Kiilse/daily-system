# Security scanning (ADR-016): secrets in the diff, CodeQL, dependencies and container images.
# `secrets`, `codeql (csharp)`, `codeql (javascript-typescript)`, `dependency-review`, `dotnet-vulnerable`,
# `npm-audit` and `images` are required checks of the main ruleset (tools/apply-repo-settings.sh).
name: security

# No `paths` filter on purpose, as in ci-backend: a required check whose workflow never starts never reports.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # Binary pinned by checksum instead of aquasecurity/trivy-action: its tags were rewritten in the
  # March 2026 supply chain attack (CVE-2026-33634). 0.74.0 is outside the compromised range (0.69.4).
  TRIVY_VERSION: 0.74.0
  TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the scanned range starts at the PR base, which can be far behind.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Scan the commits of the PR (or of the push)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        # --redact: the repository is public, so are the CI logs. --verbose still names file, line and rule.
        run: gitleaks git --redact --verbose --no-banner --log-opts="${BASE}..${HEAD}"

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.language == 'csharp'
        with:
          global-json-file: src/backend/global.json
          cache: true
          cache-dependency-path: src/backend/**/packages.lock.json

      - name: Build (C#)
        if: matrix.language == 'csharp'
        working-directory: src/backend
        run: dotnet build Ecosystem.slnx --configuration Release

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The action compares the PR head with its base: nothing to compare on a push to main.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  dotnet-vulnerable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: src/backend/global.json
          cache: true
          cache-dependency-path: src/backend/**/packages.lock.json

      - name: Restore (locked mode)
        run: dotnet restore Ecosystem.slnx --locked-mode

      - name: List vulnerable packages
        # The command exits 0 even when it finds something, so the JSON report is counted instead.
        run: |
          report=$(dotnet list Ecosystem.slnx package --vulnerable --include-transitive --no-restore --format json)
          count=$(jq '[.projects[].frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | select(.vulnerabilities)] | length' <<<"$report")
          if [[ "$count" != 0 ]]; then
            dotnet list Ecosystem.slnx package --vulnerable --include-transitive --no-restore
            echo "::error::$count vulnerable NuGet package(s)"
            exit 1
          fi

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/frontend/.nvmrc

      - name: Audit production dependencies
        # --omit=dev (ADR-016): dev-only findings with no real fix (braces, handlebars under
        # eslint-plugin-boundaries) would block every PR; new dev dependencies still go through dependency-review.
        run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        working-directory: ${{ runner.temp }}
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
          echo "${TRIVY_SHA256}  $archive" | sha256sum --check --strict
          tar -xzf "$archive" trivy
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Build images (no push)
        working-directory: src/backend
        run: |
          docker build -f Host.Core/Dockerfile -t host-core:scan .
          docker build -f Gateway.Bff/Dockerfile -t gateway-bff:scan .

      - name: SARIF reports
        # Exit code 0 here: the reports must reach code scanning even when the gate below fails.
        run: |
          for image in host-core gateway-bff; do
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --format sarif --output "trivy-$image.sarif" "$image:scan"
          done

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-host-core.sarif
          category: trivy-host-core

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-gateway-bff.sarif
          category: trivy-gateway-bff

      - name: Fail on fixable HIGH or CRITICAL
        run: |
          status=0
          for image in host-core gateway-bff; do
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image:scan" || status=1
          done
          exit "$status"
